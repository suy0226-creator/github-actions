name: "Notion & Slack Notification"

on:
  pull_request:
    types: [closed]
    branches:
      - main  # 또는 develop 등 타겟 브랜치

jobs:
  on_merge:
    # PR이 닫혔을 때 실행되되, 반드시 '머지'된 경우에만 실행함
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Send Notification to Notion and Slack
        run: |
          # 1. 노션에 기록하기 (curl 이용)
          curl -X POST https://api.notion.com/v1/pages \
            -H "Authorization: Bearer ${{ secrets.NOTION_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "Notion-Version: 2022-06-28" \
            --data '{
              "parent": { "database_id": "${{ secrets.NOTION_DATABASE_ID }}" },
              "properties": {
                "제목": { "title": [ { "text": { "content": "${{ github.event.pull_request.title }}" } } ] },
                "작업자": { "rich_text": [ { "text": { "content": "${{ github.actor }}" } } ] },
                "날짜": { "date": { "start": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'" } },
                "PR링크": { "url": "${{ github.event.pull_request.html_url }}" }
              }
            }'

          # 2. 슬랙으로 알림 쏘기
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "text": "🚀 *PR Merged to Main!*",
              "attachments": [
                {
                  "color": "#36a64f",
                  "fields": [
                    { "title": "제목", "value": "${{ github.event.pull_request.title }}", "short": false },
                    { "title": "작업자", "value": "${{ github.actor }}", "short": true },
                    { "title": "링크", "value": "<${{ github.event.pull_request.html_url }}|GitHub PR Link>", "short": true }
                  ]
                }
              ]
            }' ${{ secrets.SLACK_WEBHOOK_URL }}